appId: com.pos.rumahmakan
productName: E-Restoran
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true

win:
  icon: build/icon.ico
  target:
    - nsis
  executableName: ERestoran

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: E-Restoran
  artifactName: E-Restoran Setup ${version} (${arch}).${ext}

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/